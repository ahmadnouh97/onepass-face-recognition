services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: gatewatch
      POSTGRES_USER: gatewatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - gatewatch-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatewatch -d gatewatch"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - gatewatch-redis:/data
volumes:
  gatewatch-postgres:
  gatewatch-redis: