[project]
name = "gatewatch-conference-security"
version = "0.2.0"
description = "On-premises multi-station conference entry recognition system"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "opencv-python>=4.8,<5",
    "bcrypt>=4.0,<5",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1,<2",
    "python-jose[cryptography]>=3.3,<4",
    "python-multipart>=0.0.12,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
production-recognition = ["insightface>=0.7.3", "onnxruntime==1.20.1"]
production-recognition-gpu = ["insightface>=0.7.3", "onnxruntime-gpu>=1.19,<2"]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]